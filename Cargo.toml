[package]
name = "anthropic-lb"
version = "0.2.5"
edition = "2021"
description = "Load-balancing reverse proxy for multiple Anthropic API accounts with dynamic capacity routing"
license = "MIT"
repository = "https://github.com/27b-io/anthropic-lb"
keywords = ["anthropic", "proxy", "load-balancer", "api", "claude"]
categories = ["network-programming", "web-programming"]

[dependencies]
axum = "0.8"
hyper = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
# rustls, not native-tls (LAB-1675/#132): openssl-sys can't build in the cross
# container (aarch64 release leg), and fred/cachekit-rs already run on
# rustls-ring. Defaults are off to drop it (this also drops system-proxy:
# env-var HTTPS_PROXY still works everywhere, only macOS/Windows OS-level
# proxy lookup is lost); http2 is required (the client builder sets
# http2_keep_alive_*). native-roots keeps operator-added system CAs working
# for openai-protocol upstreams — NOTE the effective trust store is the
# UNION of system roots and the Mozilla webpki bundle, because cachekit-rs
# enables reqwest/rustls-tls (webpki) and cargo features unify. rustls has
# no CN fallback: upstream certs must carry SANs.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tower-http = { version = "0.6", features = ["trace"] }
bytes = "1"
http-body-util = "0.1"
ipnet = "2.11.0"
tokio-stream = "0.1"
# LAB-932: the coordination layer's Redis client. fred was already compiled in
# via cachekit-rs's "redis" feature — this direct dep adds zero marginal weight
# and lets the coordination layer share the fleet-standard client. Defaults
# (i-std) cover keys/hashes/scan; i-scripts adds the Lua CAS; enable-rustls-ring
# keeps rediss:// support on the ring TLS stack already in the tree.
fred = { version = "9.4", features = ["i-scripts", "enable-rustls-ring"] }
# LAB-933 response cache. NOTE: the crate is `cachekit-rs` (lib name `cachekit`,
# github.com/cachekit-io/cachekit-rs) — the crate published as plain `cachekit`
# on crates.io is an UNRELATED eviction-primitives library. Do not "fix" this.
# Default features (cachekitio SaaS backend, encryption, L1) + the fred-backed
# redis backend so both AC11 backends are selectable at runtime.
cachekit-rs = { version = "0.5", features = ["redis"] }
# Same versions cachekit-rs already pins — zero marginal dependency weight.
blake2 = "0.10"
serde_bytes = "0.11"
# Constant-time credential comparison (LAB-1083). Already in the tree via
# cachekit-rs' AEAD stack — direct use costs no extra compile.
subtle = "2.6"

[dev-dependencies]
tempfile = "3.25.0"
async-trait = "0.1"
# Test-only, deliberately NOT the production client: the redis_integration
# fixtures and assertions verify the fred-backed coordination layer through an
# independent second client, so a systematic encoding/semantics bug in our fred
# usage cannot self-certify. Never compiled into the release binary.
redis = { version = "1.0.3", features = ["tokio-comp", "connection-manager"] }
