# Debug proxy config — for investigating cache/auth behavior
# Run: cargo build && ./target/debug/anthropic-lb config-debug.toml
# Tail: tail -f debug.log
listen = "127.0.0.1:8083"
upstream = "https://api.anthropic.com"
auto_cache = true
debug_log = "debug.log"

# Single account for clean signal
# Token must be provided via a local override or by editing this file
# locally (it is gitignored).
[[accounts]]
name = "debug"
token = "YOUR_TOKEN_HERE"
