name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

# Least privilege per job (LAB-1675 panel finding): validate/build execute
# arbitrary dependency build.rs code via cargo — they must not inherit the
# ability to mint an OIDC publish token or write to the repo. Each job
# declares exactly what it needs below.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    services:
      # Real backend for the redis_integration suite (LAB-931) — same block
      # as ci.yml. With ALB_TEST_REDIS_URL set, those tests PANIC (not skip)
      # if the backend is unreachable, so the release gate can never pass
      # with the suite silently skipped.
      valkey:
        image: valkey/valkey@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6 # 8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ALB_TEST_REDIS_URL: redis://127.0.0.1:6379
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Parse version from Cargo.toml
        id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="${{ steps.version.outputs.version }}"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo clippy --all-targets

      - name: Test
        run: cargo test

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      # One exotic target failing must not cancel the siblings — we want the
      # full failure picture in one run (LAB-1675/#132).
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-13
            cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          cargo install cross --locked --version 0.2.5
          sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Strip binary
        run: |
          binary="target/${{ matrix.target }}/release/anthropic-lb"
          if [ "${{ matrix.cross }}" = "true" ]; then
            aarch64-linux-gnu-strip "$binary"
          else
            strip "$binary"
          fi

      - name: Package
        run: |
          version="${{ needs.validate.outputs.version }}"
          archive="anthropic-lb-v${version}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" anthropic-lb
          shasum -a 256 "$archive" > "${archive}.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anthropic-lb-${{ matrix.target }}
          path: |
            anthropic-lb-*.tar.gz
            anthropic-lb-*.tar.gz.sha256

  # Publish gates on Validate only, NOT the binary matrix (LAB-1675/#132):
  # with "require trusted publishing" ON this workflow is the only publish
  # path, and a tag-triggered run can't be re-run against a fixed workflow —
  # so an exotic cross-target failure must not permanently strand a version.
  # Binaries are convenience artifacts; the source release is the product.
  publish:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Authenticate with crates.io
        id: crates-io
        uses: rust-lang/crates-io-auth-action@b7e9a28eded4986ec6b1fa40eeee8f8f165559ec # v1

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}

  upload-artifacts:
    name: Upload release artifacts
    needs: [validate, build]
    # Run even when a build leg failed (needs-semantics would otherwise skip
    # this job entirely): upload whatever binaries DID build. All-legs-failed
    # leaves download-artifact with nothing and fails the job — honest red.
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      # release-please already created the release for this tag with the
      # CHANGELOG section as its body — only upload artifacts here. Passing
      # generate_release_notes on an existing release appends duplicate
      # auto-notes; omitting all other inputs preserves body + prerelease flag.
      - name: Upload release artifacts
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
