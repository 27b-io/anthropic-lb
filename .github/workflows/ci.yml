name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        if: github.event_name != 'merge_group'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: Check README for lab-deployment identifiers
        run: |
          if grep -inE '\b(gastown|openclaw|portkey|geo-pipeline|radar)\b|"ray"|LAB-[0-9]+|shared-ip outage|2026-08-24|api\.dev\.cachekit\.io|\b10\.128\.0\.0/20\b|\b10\.0\.0\.[56]\b' README.md; then
            echo "::error file=README.md::Found a lab-deployment identifier in the public README (matching line printed above). Use generic placeholders instead."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The "stable" ref only bootstraps rustup. Every cargo command below
      # actually runs the version pinned in rust-toolchain.toml, which
      # rustup resolves ahead of the default toolchain. CI is NOT unpinned.
      # No `components:` input: rust-toolchain.toml already declares
      # rustfmt+clippy, and rustup installs them onto the PINNED toolchain.
      # An input here would install onto the discarded "stable" toolchain
      # instead — two sources of truth for the same fact.
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Clippy SARIF
        if: always()
        run: |
          cargo install clippy-sarif sarif-fmt || true
          cargo clippy --all-targets --message-format=json |
            clippy-sarif | tee clippy-results.sarif | sarif-fmt
        continue-on-error: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@a60c4df7a135c7317c1e9ddf9b5a9b07a910dda9 # v4
        with:
          sarif_file: clippy-results.sarif
          wait-for-processing: true

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      # Real backend for the redis_integration suite (LAB-931). Setting
      # ALB_TEST_REDIS_URL below makes those tests PANIC (not skip) if the
      # backend is unreachable — CI can never silently pass without it.
      valkey:
        image: valkey/valkey@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6 # 8
        ports:
          - 6379:6379
        env:
          # Services take no command args; the image appends this to
          # valkey-server. `Db` in src/persistence/tests/real_redis.rs needs more than 16 DBs.
          VALKEY_EXTRA_FLAGS: --databases 32
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ALB_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Run tests
        run: cargo test
      - name: Check packaging
        run: cargo publish --dry-run --allow-dirty

  guard:
    name: Guard feature
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # The full suite runs here too, so it needs the same real backend as the
      # Test job: under CI the redis_integration tests panic (not skip) without
      # ALB_TEST_REDIS_URL. Keep this block in step with `test.services`.
      valkey:
        image: valkey/valkey@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6 # 8
        ports:
          - 6379:6379
        env:
          # Services take no command args; the image appends this to
          # valkey-server. `Db` in src/persistence/tests/real_redis.rs needs more than 16 DBs.
          VALKEY_EXTRA_FLAGS: --databases 32
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ALB_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Clippy (guard)
        run: cargo clippy --all-targets --features guard
      - name: Tests (guard)
        run: cargo test --features guard
      # The scan-latency budget is a release-binary property, so the perf test
      # asserts its tight bound only in release. Run it there so the SLO is
      # actually gated in CI, not just measurable locally.
      - name: Scan-latency budget (release)
        run: cargo test --release --features guard scan_200kb_body_under_budget
