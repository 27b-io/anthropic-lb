# Pinned so a new stable Rust release cannot turn main red with zero commits:
# CI runs with RUSTFLAGS=-Dwarnings, so a clippy lint added by a new compiler
# fails code nobody touched (#142).
#
# Keep this a CONCRETE version, never a named channel — Renovate's
# rust-toolchain manager only bumps concrete versions, so "stable" here would
# silently reintroduce the drift this file exists to prevent.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
